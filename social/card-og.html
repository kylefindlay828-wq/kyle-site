<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: oklch(96.5% 0.008 85);
    --ink: oklch(19% 0.006 55);
    --accent: oklch(54% 0.158 37);
    --muted: oklch(42% 0.013 75);
    --rule: oklch(86% 0.008 82);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--paper); color: var(--ink); font-family: Inter, sans-serif;
    position: relative; overflow: hidden; border-top: 10px solid var(--accent);
  }
  .rings { position: absolute; top: -200px; right: -200px; width: 540px; height: 540px; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--accent) 16%, transparent); }
  .rings::before, .rings::after { content: ""; position: absolute; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--accent) 12%, transparent); }
  .rings::before { inset: 95px; }
  .rings::after { inset: 180px; border-color: color-mix(in srgb, var(--accent) 22%, transparent); }

  .wrap { position: relative; height: 100%; padding: 58px 72px 52px; display: flex; flex-direction: column; }

  .kicker { display: flex; align-items: center; gap: 12px;
    font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 19px;
    text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); }
  .kicker .sq { width: 13px; height: 13px; background: var(--accent); border-radius: 3px; }

  h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600;
    font-size: 70px; line-height: 1.0; letter-spacing: -0.02em; margin-top: 26px; max-width: 1010px; }
  h1 .accent { color: var(--accent); }

  .sub { font-size: 23px; line-height: 1.4; color: color-mix(in srgb, var(--ink) 72%, transparent);
    margin-top: 22px; max-width: 800px; }
  .sub b { color: var(--ink); font-weight: 600; }

  .spacer { flex: 1; }

  .bars { display: flex; align-items: flex-end; gap: 4px; height: 48px; }
  .bars i { width: 5px; border-radius: 2.5px; background: var(--rule); }

  .foot { display: flex; align-items: baseline; justify-content: space-between; margin-top: 22px;
    border-top: 1.5px solid var(--rule); padding-top: 20px; }
  .foot .name { font-family: "Source Serif 4", serif; font-weight: 600; font-size: 24px; }
  .foot .url { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 22px; color: var(--accent); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="rings"></div>
  <div class="wrap">
    <div class="kicker"><span class="sq"></span> Proof of work · GTM Radar</div>
    <h1>I built a <span class="accent">GTM</span> market intelligence tool.</h1>
    <p class="sub">Messy company signals → the <b>roles likely to open next</b> and the <b>hidden hires an organization needs</b>. Sourced, scored, human-reviewed.</p>
    <div class="spacer"></div>
    <div class="bars" id="bars"></div>
    <div class="foot">
      <span class="name">Kyle Findlay</span>
      <span class="url">kylefindlay.xyz</span>
    </div>
  </div>
  <script>
    const bars = document.getElementById('bars');
    const N = 110;
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent');
    const rule = getComputedStyle(document.documentElement).getPropertyValue('--rule');
    for (let i = 0; i < N; i++) {
      const b = document.createElement('i');
      const h = 8 + Math.round(38 * (0.5 + 0.5 * Math.sin(i / 3.1)) * (0.55 + 0.45 * Math.sin(i / 13)));
      b.style.height = h + 'px';
      const lit = i > 44 && i < 60;
      b.style.background = lit ? `color-mix(in srgb, ${accent} ${90 - Math.abs(52 - i) * 4}%, ${rule})` : rule;
      bars.appendChild(b);
    }
  </script>
</body>
</html>
